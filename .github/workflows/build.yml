name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-essential git zip unzip \
          zlib1g-dev libncurses5-dev libstdc++6 libffi-dev libssl-dev \
          openjdk-17-jdk libsdl2-dev libsdl2-ttf-dev \
          libsdl2-image-dev libsdl2-mixer-dev autoconf libtool cmake

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33
        pip install buildozer

    - name: Clean buildozer cache
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: myfinances-apk
        path: bin/*.apk
