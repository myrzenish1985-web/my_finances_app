name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk
        pip install buildozer cython

    - name: Accept Android licenses
      run: |
        # Создаём директорию и принимаем лицензии автоматически
        mkdir -p ~/.android
        echo "yes" | sdkmanager --licenses 2>/dev/null || true
        
    - name: Setup Android SDK
      run: |
        # Устанавливаем SDK и build-tools
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" || true
        
    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-finances-apk
        path: ./bin/*.apk
